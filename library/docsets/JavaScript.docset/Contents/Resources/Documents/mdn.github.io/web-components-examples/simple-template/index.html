  <meta charset="utf-8">
  <title>Simple template</title>
  <script src="main.js" defer=""></script>
</head>
<body>
  <h1>Simple template</h1>

  <template id="custom-paragraph">
    <style>
      p {
        color: white;
        background-color: #666;
        padding: 5px;
      }
    </style>
    <p>
      <slot name="my-text">My default text</slot>
    </p>
  </template>

  <my-paragraph>
    <span slot="my-text">Let's have some different text!</span>
  </my-paragraph>

  <my-paragraph>
    <ul slot="my-text">
      <li>Let's have some different text!</li>
      <li>In a list!</li>
    </ul>
  </my-paragraph>





</body><!-- Mirrored from mdn.github.io/web-components-examples/simple-template/ by HTTrack Website Copier/3.x [XR&CO'2014], Fri, 17 Apr 2026 21:57:19 GMT --></html>

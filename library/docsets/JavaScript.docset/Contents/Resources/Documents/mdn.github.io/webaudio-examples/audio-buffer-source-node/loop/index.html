    <title>Web Audio API examples: looping a track</title>

    <script src="script.js" defer=""></script>
  </head>

  <body>
    <h1>Web Audio API examples: looping a track</h1>

    <button id="play">Play</button>
    <button id="stop" disabled="">Stop</button>

    <h2>Set loop start and loop end</h2>
    <input id="loopstart-control" type="range" min="0" max="20" step="1" value="0" disabled="">
    Starts at <span id="loopstart-value">0</span> s.
    <br>
    <input id="loopend-control" type="range" min="0" max="20" step="1" value="0" disabled="">
    Stops at <span id="loopend-value">0</span> s.
    <p>
      If the stop time is lower or equal to the start time, it'll loop over the
      whole track.
    </p>
  



</body><!-- Mirrored from mdn.github.io/webaudio-examples/audio-buffer-source-node/loop/ by HTTrack Website Copier/3.x [XR&CO'2014], Fri, 17 Apr 2026 21:58:46 GMT --></html>

    <title>Image gallery</title>

  <body>
    <h1>Gallery</h1>

    <div class="full-img">
      <figure>
        <img class="displayed-img" src="../../../shared-assets/images/examples/learn/gallery/pic1.jpg" alt="Closeup of a human eye" data-id="0">
        <figcaption>Closeup of a human eye</figcaption>
      </figure>
    </div>

      <button class="prev" aria-label="Previous">◄</button>
      <div class="thumb-bar"></div>
      <button class="next" aria-label="Next">►</button>
    </div>

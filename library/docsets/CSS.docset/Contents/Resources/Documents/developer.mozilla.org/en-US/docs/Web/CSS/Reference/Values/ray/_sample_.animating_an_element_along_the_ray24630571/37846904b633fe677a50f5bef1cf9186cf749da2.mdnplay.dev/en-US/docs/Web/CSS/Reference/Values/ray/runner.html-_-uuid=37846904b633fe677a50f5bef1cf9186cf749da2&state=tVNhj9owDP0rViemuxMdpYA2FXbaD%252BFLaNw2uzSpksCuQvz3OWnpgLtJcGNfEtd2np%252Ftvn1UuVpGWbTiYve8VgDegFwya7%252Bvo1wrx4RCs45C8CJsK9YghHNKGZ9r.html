</pre>

  </div>
</div>

<pre>  offset-position: auto;
  offset-path: ray(120deg closest-corner);
</pre>

<div>
  <div class="container">
    <div class="shape shape5">—</div>
  </div>
</div>

<pre>  offset-position: auto;
  offset-path: ray(120deg farthest-corner);
</pre>

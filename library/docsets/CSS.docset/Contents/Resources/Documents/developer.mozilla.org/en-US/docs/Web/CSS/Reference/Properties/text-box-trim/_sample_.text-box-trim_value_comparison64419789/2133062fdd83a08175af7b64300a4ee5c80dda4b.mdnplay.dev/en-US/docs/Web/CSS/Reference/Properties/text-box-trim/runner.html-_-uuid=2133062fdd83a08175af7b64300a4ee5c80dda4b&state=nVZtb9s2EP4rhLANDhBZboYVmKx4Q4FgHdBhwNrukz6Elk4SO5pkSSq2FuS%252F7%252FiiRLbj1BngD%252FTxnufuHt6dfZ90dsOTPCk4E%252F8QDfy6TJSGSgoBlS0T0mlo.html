        <link href="https://fonts.googleapis.com/" rel="preconnect"></link>
<link href="https://fonts.gstatic.com/" rel="preconnect"></link>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&amp;display=swap"></link>
<section>
  <div>
    <label for="box-trim">Select edge(s) to trim:</label>
    <select id="box-trim">
      <option>none</option>
      <option>trim-start</option>
      <option>trim-end</option>
      <option selected="">trim-both</option>
    </select>
  </div>
  <div>
    <label for="trim-over">Select trim over (start) value:</label>
    <select id="trim-over">
      <option>text</option>
      <option selected="">cap</option>
      <option>ex</option>
    </select>
  </div>
</section>
<p class="display" contenteditable="" style="text-box: cap alphabetic;">Holly Golightly</p>
<section>
  <div>
    <label for="trim-under">Select trim under (end) value:</label>
    <select id="trim-under">
      <option>text</option>
      <option selected="">alphabetic</option>
    </select>
  </div>
</section>
<output>
    <span><code>text-box-trim: trim-both</code></span>
    <br>
    <span><code>text-box-edge: cap alphabetic</code></span>
    <br><br>
    <span>Shorthand equivalent:</span>
    <br><br>
    <span><code>text-box: trim-both cap alphabetic</code></span>
  </output>

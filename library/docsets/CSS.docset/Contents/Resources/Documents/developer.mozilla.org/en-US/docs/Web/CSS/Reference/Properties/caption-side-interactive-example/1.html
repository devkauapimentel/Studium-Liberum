<html><head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>CSS Demo: caption-side</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="../../../../../../../../interactive_examples/assets/css/codemirror.css" rel="stylesheet">
    <link href="../../../../../../../../interactive_examples/assets/css/editor-css.css" rel="stylesheet">
    <style>table {
  font-size: 1.2rem;
  text-align: left;
  color: black;
}

th,
td {
  padding: 0.2rem 1rem;
}

caption {
  background: #ffcc33;
  padding: 0.5rem 1rem;
}

tr {
  background: #eeeeee;
}

tr:nth-child(even) {
  background: #cccccc;
}


 button.copy {display:none !important}</style>  </head>

  <body>
    <header class="output-header border-rounded-top">
      <h4 class="output-heading">CSS Demo: caption-side</h4>
      <button id="reset" class="reset" type="button">Reset</button>
    </header>
    <noscript>
      <div id="warning-no-script" class="warning-container">
        <div class="warning">
          The interactive example cannot be shown because JavaScript is
          disabled.
        </div>
      </div>
    </noscript>
    <div id="warning-mathml-not-supported" class="warning-container hidden">
      <div class="warning">
        The interactive example cannot be shown because MathML is not supported
        by your browser.
      </div>
    </div>
    <div id="editor-wrapper" class="editor-wrapper border-rounded-bottom hidden">
      <section id="example-choice-list" class="example-choice-list">
          <div class="example-choice">
<pre><code class="language-css">caption-side: top;
</code></pre><button type="button" class="copy hidden" aria-hidden="true"><span class="visually-hidden">Copy to Clipboard</span></button>
</div>
<div class="example-choice">
<pre><code class="language-css">caption-side: bottom;
</code></pre><button type="button" class="copy hidden" aria-hidden="true"><span class="visually-hidden">Copy to Clipboard</span></button>
</div>
      </section>
      <div id="output" class="output hidden">
          <section class="default-example" id="default-example">
  <table class="transition-all" id="example-element">
    <caption>
      Famous animals
    </caption>
    <tbody>
      <tr>
        <th>Name</th>
        <th>Location</th>
      </tr>
      <tr>
        <td>Giraffe</td>
        <td>Africa</td>
      </tr>
      <tr>
        <td>Penguin</td>
        <td>Antarctica</td>
      </tr>
      <tr>
        <td>Sloth</td>
        <td>South America</td>
      </tr>
      <tr>
        <td>Tiger</td>
        <td>Asia</td>
      </tr>
    </tbody>
  </table>
</section>
      </div>
    </div>

    <script src="../../../../../../../../interactive_examples/assets/js/codemirror.js"></script>
    <script src="../../../../../../../../interactive_examples/assets/js/editor-css.js"></script>
    <script></script></body></html>

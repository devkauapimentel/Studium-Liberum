<html><head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>CSS Demo: animation-iteration-count</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="../../../../../../../../interactive_examples/assets/css/codemirror.css" rel="stylesheet">
    <link href="../../../../../../../../interactive_examples/assets/css/editor-css.css" rel="stylesheet">
    <style>#example-element {
  align-items: center;
  background-color: #1766aa;
  border-radius: 50%;
  border: 5px solid #333333;
  color: white;
  display: flex;
  flex-direction: column;
  height: 150px;
  justify-content: center;
  margin: auto;
  margin-left: 0;
  width: 150px;
}

#play-status {
  font-weight: bold;
}

.animating {
  animation-name: slide;
  animation-duration: 3s;
  animation-timing-function: ease-in;
}

@keyframes slide {
  from {
    background-color: orange;
    color: black;
    margin-left: 0;
  }
  to {
    background-color: orange;
    color: black;
    margin-left: 80%;
  }
}


 button.copy {display:none !important}</style>  </head>

  <body>
    <header class="output-header border-rounded-top">
      <h4 class="output-heading">CSS Demo: animation-iteration-count</h4>
      <button id="reset" class="reset" type="button">Reset</button>
    </header>
    <noscript>
      <div id="warning-no-script" class="warning-container">
        <div class="warning">
          The interactive example cannot be shown because JavaScript is
          disabled.
        </div>
      </div>
    </noscript>
    <div id="warning-mathml-not-supported" class="warning-container hidden">
      <div class="warning">
        The interactive example cannot be shown because MathML is not supported
        by your browser.
      </div>
    </div>
    <div id="editor-wrapper" class="editor-wrapper border-rounded-bottom hidden">
      <section id="example-choice-list" class="example-choice-list">
          <div class="example-choice">
<pre><code class="language-css">animation-iteration-count: 0;
</code></pre><button type="button" class="copy hidden" aria-hidden="true"><span class="visually-hidden">Copy to Clipboard</span></button>
</div>
<div class="example-choice">
<pre><code class="language-css">animation-iteration-count: 2;
</code></pre><button type="button" class="copy hidden" aria-hidden="true"><span class="visually-hidden">Copy to Clipboard</span></button>
</div>
<div class="example-choice">
<pre><code class="language-css">animation-iteration-count: 1.5;
</code></pre><button type="button" class="copy hidden" aria-hidden="true"><span class="visually-hidden">Copy to Clipboard</span></button>
</div>
      </section>
      <div id="output" class="output hidden">
          <section class="flex-column" id="default-example">
  <div>Animation <span id="play-status"></span></div>
  <div id="example-element">Select a count to start!</div>
</section>
      </div>
    </div>

    <script src="../../../../../../../../interactive_examples/assets/js/codemirror.js"></script>
    <script src="../../../../../../../../interactive_examples/assets/js/editor-css.js"></script>
    <script>const el = document.getElementById("example-element");
const status = document.getElementById("play-status");

function update() {
  status.textContent = "delaying";
  el.className = "";
  window.requestAnimationFrame(() => {
    window.requestAnimationFrame(() => {
      el.className = "animating";
    });
  });
}

el.addEventListener("animationstart", () => {
  status.textContent = "playing";
});

el.addEventListener("animationend", () => {
  status.textContent = "finished";
});

const observer = new MutationObserver(() => {
  update();
});

observer.observe(el, {
  attributes: true,
  attributeFilter: ["style"],
});

update();
</script></body></html>

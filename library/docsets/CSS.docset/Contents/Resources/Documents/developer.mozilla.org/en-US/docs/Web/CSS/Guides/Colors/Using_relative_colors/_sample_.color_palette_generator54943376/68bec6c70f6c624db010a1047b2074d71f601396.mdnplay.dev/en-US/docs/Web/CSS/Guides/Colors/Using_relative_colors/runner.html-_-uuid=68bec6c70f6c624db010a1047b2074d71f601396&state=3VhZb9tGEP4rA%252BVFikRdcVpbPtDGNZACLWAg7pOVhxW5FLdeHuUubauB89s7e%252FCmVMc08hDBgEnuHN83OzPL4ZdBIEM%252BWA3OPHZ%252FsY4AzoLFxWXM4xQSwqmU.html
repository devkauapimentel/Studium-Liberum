  <a name="//apple_ref/Section/Color%20palette%20generator" class="dashAnchor"></a><h1 id="Colorpalettegenerator">Color palette generator</h1>
  <form>
    <div id="color-picker">
      <label for="color">Select a base color:</label>
      <input type="color" id="color" name="color" value="#ff0000">
    </div>
    <div>
      <fieldset>
        <legend>Select a color palette type:</legend>

        <div>
          <input type="radio" id="comp" name="palette-type" value="comp" checked="">
          <label for="comp">Complementary</label>
        </div>

        <div>
          <input type="radio" id="triadic" name="palette-type" value="triadic">
          <label for="triadic">Triadic</label>
        </div>

        <div>
          <input type="radio" id="tetradic" name="palette-type" value="tetradic">
          <label for="tetradic">Tetradic</label>
        </div>

        <div>
          <input type="radio" id="monochrome" name="palette-type" value="monochrome">
          <label for="monochrome">Monochrome</label>
        </div>
      </fieldset>
    </div>
  </form>
  <div id="container" class="comp">

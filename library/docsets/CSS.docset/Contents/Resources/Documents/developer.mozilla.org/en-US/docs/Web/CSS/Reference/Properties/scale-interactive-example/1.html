<html><head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>CSS Demo: scale</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="../../../../../../../../interactive_examples/assets/css/codemirror.css" rel="stylesheet">
    <link href="../../../../../../../../interactive_examples/assets/css/editor-css.css" rel="stylesheet">
    <style>#default-example {
  background: linear-gradient(skyblue, khaki);
  perspective: 800px;
  perspective-origin: 150% 150%;
}

#example-element {
  width: 100px;
  height: 100px;
  perspective: 550px;
  transform-style: preserve-3d;
}

.face {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  position: absolute;
  backface-visibility: inherit;
  font-size: 60px;
  color: white;
}

.front {
  background: rgb(90 90 90 / 0.7);
  transform: translateZ(50px);
}

.back {
  background: rgb(0 210 0 / 0.7);
  transform: rotateY(180deg) translateZ(50px);
}

.right {
  background: rgb(210 0 0 / 0.7);
  transform: rotateY(90deg) translateZ(50px);
}

.left {
  background: rgb(0 0 210 / 0.7);
  transform: rotateY(-90deg) translateZ(50px);
}

.top {
  background: rgb(210 210 0 / 0.7);
  transform: rotateX(90deg) translateZ(50px);
}

.bottom {
  background: rgb(210 0 210 / 0.7);
  transform: rotateX(-90deg) translateZ(50px);
}


 button.copy {display:none !important}</style>  </head>

  <body>
    <header class="output-header border-rounded-top">
      <h4 class="output-heading">CSS Demo: scale</h4>
      <button id="reset" class="reset" type="button">Reset</button>
    </header>
    <noscript>
      <div id="warning-no-script" class="warning-container">
        <div class="warning">
          The interactive example cannot be shown because JavaScript is
          disabled.
        </div>
      </div>
    </noscript>
    <div id="warning-mathml-not-supported" class="warning-container hidden">
      <div class="warning">
        The interactive example cannot be shown because MathML is not supported
        by your browser.
      </div>
    </div>
    <div id="editor-wrapper" class="editor-wrapper border-rounded-bottom hidden">
      <section id="example-choice-list" class="example-choice-list">
          <div class="example-choice">
<pre><code class="language-css">scale: none;
</code></pre><button type="button" class="copy hidden" aria-hidden="true"><span class="visually-hidden">Copy to Clipboard</span></button>
</div>
<div class="example-choice">
<pre><code class="language-css">scale: 1.5;
</code></pre><button type="button" class="copy hidden" aria-hidden="true"><span class="visually-hidden">Copy to Clipboard</span></button>
</div>
<div class="example-choice">
<pre><code class="language-css">scale: 1.7 50%;
</code></pre><button type="button" class="copy hidden" aria-hidden="true"><span class="visually-hidden">Copy to Clipboard</span></button>
</div>
<div class="example-choice">
<pre><code class="language-css">scale: 1 -1;
</code></pre><button type="button" class="copy hidden" aria-hidden="true"><span class="visually-hidden">Copy to Clipboard</span></button>
</div>
<div class="example-choice">
<pre><code class="language-css">scale: 1.2 1.2 2;
</code></pre><button type="button" class="copy hidden" aria-hidden="true"><span class="visually-hidden">Copy to Clipboard</span></button>
</div>
      </section>
      <div id="output" class="output hidden">
          <section class="default-example" id="default-example">
  <div class="transition-all" id="example-element">
    <div class="face front">1</div>
    <div class="face back">2</div>
    <div class="face right">3</div>
    <div class="face left">4</div>
    <div class="face top">5</div>
    <div class="face bottom">6</div>
  </div>
</section>
      </div>
    </div>

    <script src="../../../../../../../../interactive_examples/assets/js/codemirror.js"></script>
    <script src="../../../../../../../../interactive_examples/assets/js/editor-css.js"></script>
    <script></script></body></html>

<html><head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>CSS Demo: offset</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="../../../../../../../../interactive_examples/assets/css/codemirror.css" rel="stylesheet">
    <link href="../../../../../../../../interactive_examples/assets/css/editor-css.css" rel="stylesheet">
    <style>#example-element {
  width: 24px;
  height: 24px;
  background: #2bc4a2;
  clip-path: polygon(0% 0%, 70% 0%, 100% 50%, 70% 100%, 0% 100%, 30% 50%);
  animation: distance 3000ms infinite normal ease-in-out;
  animation-play-state: paused;
}

#example-element.running {
  animation-play-state: running;
}

.wrapper {
  height: 220px;
  width: 200px;
  background:
    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 140" width="200" height="140"><path d="M 0 60 L 100 60 L 50 10 L 0 60" fill="none" stroke="lightgrey" stroke-width="2" stroke-dasharray="4.5"/></svg>')
      no-repeat,
    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -140 150 230" width="200" height="230"><path d="M 0 70 L 56 70 L 98 0 L 42 0 L 0 70" fill="none" stroke="lightgrey" stroke-width="2" stroke-dasharray="4.5"/></svg>');
}

@keyframes distance {
  to {
    offset-distance: 100%;
  }
}

#playback {
  position: absolute;
  top: 0;
  left: 0;
  font-size: 1em;
}


 button.copy {display:none !important}</style>  </head>

  <body>
    <header class="output-header border-rounded-top">
      <h4 class="output-heading">CSS Demo: offset</h4>
      <button id="reset" class="reset" type="button">Reset</button>
    </header>
    <noscript>
      <div id="warning-no-script" class="warning-container">
        <div class="warning">
          The interactive example cannot be shown because JavaScript is
          disabled.
        </div>
      </div>
    </noscript>
    <div id="warning-mathml-not-supported" class="warning-container hidden">
      <div class="warning">
        The interactive example cannot be shown because MathML is not supported
        by your browser.
      </div>
    </div>
    <div id="editor-wrapper" class="editor-wrapper border-rounded-bottom hidden">
      <section id="example-choice-list" class="example-choice-list">
          <div class="example-choice">
<pre><code class="language-css">offset: path("M 20 60 L 120 60 L 70 10 L 20 60") 0% auto 90deg;
</code></pre><button type="button" class="copy hidden" aria-hidden="true"><span class="visually-hidden">Copy to Clipboard</span></button>
</div>
<div class="example-choice">
<pre><code class="language-css">offset: path(
    "M 20 210 L 74 210 L 118 140 \
 L 62 140 L 20 210"
  )
  20% auto;
</code></pre><button type="button" class="copy hidden" aria-hidden="true"><span class="visually-hidden">Copy to Clipboard</span></button>
</div>
      </section>
      <div id="output" class="output hidden">
          <section class="default-example" id="default-example">
  <div class="wrapper">
    <div id="example-element"></div>
  </div>
  <button id="playback" type="button">Play</button>
</section>
      </div>
    </div>

    <script src="../../../../../../../../interactive_examples/assets/js/codemirror.js"></script>
    <script src="../../../../../../../../interactive_examples/assets/js/editor-css.js"></script>
    <script>const example = document.getElementById("example-element");
const button = document.getElementById("playback");

button.addEventListener("click", () => {
  if (example.classList.contains("running")) {
    example.classList.remove("running");
    button.textContent = "Play";
  } else {
    example.classList.add("running");
    button.textContent = "Pause";
  }
});
</script></body></html>

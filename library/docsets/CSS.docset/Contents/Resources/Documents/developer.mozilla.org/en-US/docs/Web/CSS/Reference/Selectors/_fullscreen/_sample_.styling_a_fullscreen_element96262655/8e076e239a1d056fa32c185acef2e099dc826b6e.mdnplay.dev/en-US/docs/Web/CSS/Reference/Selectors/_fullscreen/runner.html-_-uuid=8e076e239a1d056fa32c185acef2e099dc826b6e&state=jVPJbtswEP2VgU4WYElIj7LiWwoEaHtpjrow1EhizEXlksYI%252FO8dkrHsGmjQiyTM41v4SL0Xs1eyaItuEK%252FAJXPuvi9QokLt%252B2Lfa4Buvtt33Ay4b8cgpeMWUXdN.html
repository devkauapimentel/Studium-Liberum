  <a name="//apple_ref/Section/%3Afullscreen%20pseudo%2Dclass%20demo" class="dashAnchor"></a><h1 id="fullscreenpseudoclassdemo"><code>:fullscreen</code> pseudo-class demo</h1>

  <p>
    This demo uses the <code>:fullscreen</code> pseudo-class to automatically
    change the background color of the <code>.element</code> div.
  </p>

  <p>
    Normally, the background is light yellow. In fullscreen mode, the background
    is light pink.
  </p>
